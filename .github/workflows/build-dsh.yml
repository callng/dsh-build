name: Build and release DSH for Windows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-dsh.yml
      - scripts/**
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: dsh-windows-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.upstream.outputs.build }}
      tag: ${{ steps.upstream.outputs.tag }}
      sha: ${{ steps.upstream.outputs.sha }}
      node: ${{ steps.upstream.outputs.node }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the newest upstream tag
        id: upstream
        uses: actions/github-script@v9.0.0
        with:
          script: await require('./scripts/check-upstream.cjs')({ github, context, core });
      - name: Retain the original upstream release metadata
        if: steps.upstream.outputs.build == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: upstream-release
          path: upstream-release.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: upstream
    env:
      CI: 'true'
      LEFTHOOK: '0'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7.0.1
        with:
          path: builder
          persist-credentials: false
      - name: Checkout the exact upstream tag commit
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.check.outputs.node }}
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: upstream/package.json
          run_install: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare unsigned Windows packaging
        run: node ../builder/scripts/prepare-upstream.cjs .
      - name: Install the locked upstream dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the packaging configuration and Windows toolchain
        run: pnpm run package:desktop:win:x64:unsigned --check
      - name: Build the installer and run upstream runtime verification
        run: pnpm run package:desktop:win:x64:unsigned
      - name: Retain the Windows installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-installer
          path: upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*-win-x64-unsigned.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-packaging-logs
          path: upstream/apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: upstream-release
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-installer
          path: release
      - name: Publish the installer with the original tag and changelog
        uses: actions/github-script@v9.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: await require('./scripts/publish-release.cjs')({ github, context, core });
